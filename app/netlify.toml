# Put this file at app/netlify.toml and set Netlify "Base directory" = app.
# With a base directory, the paths below are relative to app/.
[build]
  command = "npm run build"
  publish = "dist"            # the BUILT site (app/dist), never app/ itself

[build.environment]
  NODE_VERSION = "20"         # Vite 6 needs Node 18+

# Routing (fixed routes, detail pages, real 404s) lives in public/_redirects.
# Do not add a "/*" -> "/index.html" rule here: it would turn every unknown URL into a soft 404.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    # Googlebot may fetch the data (the pages need it to render), but the raw JSON stays out of results.
    X-Robots-Tag = "noindex"
